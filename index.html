<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Treasure Hunt For Her</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="game-canvas"></canvas>
<div id="fade-overlay"></div>

<div id="title-screen" class="overlay">
  <div class="panel title-panel">
    <div class="title-hearts">💛</div>
    <h1 id="title-heading"></h1>
    <p id="title-subheading"></p>
    <button id="play-btn" class="chunky-btn">Start the Adventure</button>
    <p class="hint-text">WASD to move · drag the mouse to look around · E to interact</p>
  </div>
</div>

<div id="hud" class="hidden">
  <div id="room-label"></div>
  <div id="milestone-counter" class="hidden"></div>
</div>

<div id="interact-prompt" class="hidden"></div>

<div id="dialogue-box" class="overlay-bottom hidden">
  <div class="panel dialogue-panel">
    <p id="dialogue-text"></p>
    <button id="dialogue-next" class="chunky-btn small">Next ▸</button>
  </div>
</div>

<div id="memory-card" class="overlay hidden">
  <div class="panel memory-panel">
    <h2 id="memory-title"></h2>
    <p id="memory-text"></p>
    <button id="memory-close" class="chunky-btn">Continue</button>
  </div>
</div>

<div id="riddle-modal" class="overlay hidden">
  <div class="panel riddle-panel">
    <p id="riddle-intro"></p>
    <p id="riddle-question" class="riddle-question"></p>
    <input id="riddle-input" type="text" placeholder="Type your answer..." autocomplete="off">
    <div class="riddle-actions">
      <button id="riddle-submit" class="chunky-btn">Answer</button>
      <button id="riddle-hint-btn" class="chunky-btn secondary">Hint</button>
    </div>
    <p id="riddle-feedback"></p>
  </div>
</div>

<div id="milestone-popup" class="hidden">
  <div class="panel milestone-mini">
    <strong id="milestone-popup-title"></strong>
    <p id="milestone-popup-text"></p>
  </div>
</div>

<div id="toast" class="hidden"></div>

<div id="finale-overlay" class="overlay hidden">
  <canvas id="confetti-canvas"></canvas>
  <div class="panel letter-panel">
    <div class="wax-seal">💌</div>
    <p id="letter-title"></p>
    <div id="letter-body"></div>
    <p id="letter-signoff"></p>
    <button id="replay-btn" class="chunky-btn">Play Again</button>
  </div>
</div>

<script src="js/vendor/three.min.js"></script>
<script src="js/content.js"></script>
<script src="js/game.js"></script>
</body>
</html>
